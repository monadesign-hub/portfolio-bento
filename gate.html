<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mona Wang — Private Portfolio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#08080a; --text:#f4f4f6; --muted:#9a9aa3;
      --accent:#75A8FF; --accent-2:#5FC8FF;
      --glass-bg:rgba(255,255,255,.045); --glass-border:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      background:var(--bg); color:var(--text);
      font-family:"Inter",system-ui,sans-serif;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.5}
    .blob.a{width:46vw;height:46vw;background:radial-gradient(circle,rgba(117,168,255,.5),transparent 70%);top:-14vw;right:-8vw}
    .blob.b{width:38vw;height:38vw;background:radial-gradient(circle,rgba(95,200,255,.35),transparent 70%);bottom:-12vw;left:-10vw}
    .gate{
      position:relative; z-index:1; width:min(400px,calc(100vw - 40px));
      padding:38px 34px 34px; border-radius:24px;
      background:var(--glass-bg); border:1px solid var(--glass-border);
      backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 30px 80px rgba(0,0,0,.5);
      text-align:center;
    }
    .lock{
      width:44px;height:44px;margin:0 auto 18px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(117,168,255,.12);border:1px solid rgba(117,168,255,.3);
      color:var(--accent);
    }
    h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;letter-spacing:-.01em}
    h1 em{color:var(--accent);font-style:italic}
    .sub{margin:10px 0 26px;font-size:13.5px;line-height:1.6;color:var(--muted)}
    form{display:flex;gap:8px}
    input{
      flex:1;height:46px;padding:0 16px;border-radius:12px;
      border:1px solid var(--glass-border);background:rgba(0,0,0,.35);
      color:var(--text);font:500 14px "JetBrains Mono",monospace;letter-spacing:.04em;
      outline:none;transition:border-color .2s;
    }
    input:focus{border-color:rgba(117,168,255,.55)}
    button{
      height:46px;padding:0 18px;border-radius:12px;border:1px solid rgba(117,168,255,.4);
      background:rgba(117,168,255,.16);color:#dbe9ff;font:600 14px "Inter",sans-serif;
      cursor:pointer;transition:background .2s;
    }
    button:hover{background:rgba(117,168,255,.3)}
    .err{
      display:none;margin-top:14px;font:500 12px "JetBrains Mono",monospace;
      letter-spacing:.03em;color:#ff9d9d;
    }
    .err.show{display:block}
    .foot{margin-top:26px;font:400 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  </style>
</head>
<body>
  <span class="blob a" aria-hidden="true"></span>
  <span class="blob b" aria-hidden="true"></span>

  <main class="gate">
    <div class="lock" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>Mona Wang — <em>Portfolio</em></h1>
    <p class="sub">This portfolio is private. Enter the password you received to continue.</p>
    <form id="gate-form">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Portfolio password" autofocus />
      <button type="submit">Enter&nbsp;→</button>
    </form>
    <p class="err" id="err">Incorrect password — please try again.</p>
    <p class="foot">Product Design Engineer · SF Bay Area</p>
  </main>

  <script>
    (function () {
      var form = document.getElementById('gate-form');
      var pw = document.getElementById('pw');
      var err = document.getElementById('err');

      // if we bounced back here after a failed attempt, say so
      if (sessionStorage.getItem('gate-tried')) {
        err.classList.add('show');
        sessionStorage.removeItem('gate-tried');
      }

      async function sha256Hex(text) {
        var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!pw.value) return;
        var hash = await sha256Hex(pw.value);
        document.cookie = 'folio_key=' + hash + '; Path=/; Max-Age=2592000; Secure; SameSite=Lax';
        sessionStorage.setItem('gate-tried', '1');
        location.href = '/';
      });
    })();
  </script>
</body>
</html>
